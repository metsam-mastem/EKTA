[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ves-core"
version = "0.1.0"
description = "Universal Visual Engineering Studio core model"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["PyYAML>=6.0", "jsonschema>=4.20"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["ves_core", "ves_storage", "ves_forms", "ves_catalog"]
