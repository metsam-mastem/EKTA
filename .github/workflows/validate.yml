name: EKTA validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate documentation
        run: python tools/validate_docs.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
