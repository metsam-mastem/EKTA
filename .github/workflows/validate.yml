name: EKTA validation

on:
  push:
    branches: [main, "runtime/**", "workbench/**", "knowledge/**", "taxonomy/**", "docs/**", "integration/**"]
  pull_request:
  workflow_dispatch:

jobs:
  docs-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate documentation
        run: python tools/validate_docs.py
      - name: Validate UPDS document records
        run: python tools/validate_upds.py
      - name: Run unit and runtime tests
        run: python -m unittest discover -s tests -v
      - name: Validate explorer HTML and JavaScript
        run: python tools/validate_frontend.py
      - name: Export typed knowledge graph
        run: python tools/build_graph.py
