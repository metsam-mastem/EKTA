name: EKTA validation

on:
  push:
    branches: [main, "runtime/**", "workbench/**", "knowledge/**", "taxonomy/**", "docs/**", "project/**"]
  pull_request:
  workflow_dispatch:

jobs:
  docs-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate documentation
        run: python tools/validate_docs.py
      - name: Run unit and runtime tests
        run: python -m unittest discover -s tests -v
      - name: Run VES model tests
        env:
          PYTHONPATH: projects/ves/src
        run: python -m unittest discover -s projects/ves/tests -v
      - name: Validate VES schemas and browser scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for schema in Path("projects/ves/schemas").glob("*.json"):
              json.loads(schema.read_text(encoding="utf-8"))
          PY
          node --check projects/ves/web/app.js
          node --check projects/ves/web/catalog.js
      - name: Validate explorer HTML and JavaScript
        run: python tools/validate_frontend.py
      - name: Export typed knowledge graph
        run: python tools/build_graph.py
