name: EKTA validation

on:
  push:
    branches: [main, "runtime/**", "workbench/**", "knowledge/**", "taxonomy/**", "docs/**"]
  pull_request:
  workflow_dispatch:

jobs:
  docs-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify pinned project submodules
        shell: bash
        run: |
          git submodule status --recursive
          if git submodule status --recursive | grep -E '^[+-U]'; then
            echo "A submodule is missing, mismatched, or conflicted."
            exit 1
          fi
      - name: Validate documentation
        run: python tools/validate_docs.py
      - name: Run unit and runtime tests
        run: python -m unittest discover -s tests -v
      - name: Validate explorer HTML and JavaScript
        run: python tools/validate_frontend.py
      - name: Export typed knowledge graph
        run: python tools/build_graph.py
