[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ekta-runtime"
version = "0.1.0"
description = "Local-first runtime for the Engineering Knowledge & Techniques Atlas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED — repository license decision pending" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[project.scripts]
ekta = "ekta_runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "runtime"}
packages = ["ekta_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["runtime", "tools"]
